<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Shopping Mall - A-Frame Virtual Store</title>
  <!-- Load A-Frame 1.6.0 Standalone Engine -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Top Quick Navigation Toolbar */
    .quick-nav {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .quick-nav span {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 4px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: #4f46e5;
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }

    .nav-btn.active {
      background: #4f46e5;
      color: #ffffff;
      border-color: #818cf8;
    }

    /* Controls helper banner at bottom */
    .controls-info {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .key-badge {
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: bold;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Standalone Product Preview Modal (Fallback) */
    #standalone-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 340px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      border: 1px solid #e2e8f0;
      z-index: 100;
      pointer-events: auto;
      animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalPop {
      0% { opacity: 0; transform: translate(-50%, -46%) scale(0.95); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    #modal-image-container {
      width: 100%;
      height: 180px;
      background: #f1f5f9;
      position: relative;
      overflow: hidden;
    }

    #modal-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #modal-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #modal-body {
      padding: 16px;
    }

    #modal-category {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #6366f1;
      letter-spacing: 0.5px;
    }

    #modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin: 4px 0 8px 0;
    }

    #modal-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.4;
      margin-bottom: 12px;
      max-height: 60px;
      overflow-y: auto;
    }

    #modal-price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }

    #modal-price {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
    }

    #modal-action-btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #modal-action-btn:hover {
      background: #4338ca;
    }
  </style>

  <script>
    // Robust Product Plaque Component for A-Frame
    AFRAME.registerComponent('product-plaque', {
      schema: {
        id: { type: 'string' },
        name: { type: 'string' },
        price: { type: 'number' },
        category: { type: 'string' },
        imageUrl: { type: 'string' },
        description: { type: 'string' },
        storeId: { type: 'string' }
      },
      init: function () {
        var self = this;
        var onPlaqueClick = function (evt) {
          if (evt && evt.stopPropagation) evt.stopPropagation();
          console.log('[A-Frame] Clicked product plaque:', self.data.name, self.data.id);
          window.handleProductSelection(self.data);
        };

        this.el.addEventListener('click', onPlaqueClick);

        // Also ensure all child meshes inherit the click trigger
        this.el.addEventListener('loaded', function () {
          var children = self.el.querySelectorAll('.clickable');
          children.forEach(function (child) {
            child.addEventListener('click', onPlaqueClick);
          });
        });
      }
    });

    // Mall Navigation Bounds (Keeps player inside corridors and shop rooms)
    AFRAME.registerComponent('mall-navigation-bounds', {
      tick: function () {
        var pos = this.el.object3D.position;
        pos.y = 1.6; // Keep constant eye level

        // Mall length boundaries
        if (pos.z > 9.0) pos.z = 9.0;
        if (pos.z < -72.0) pos.z = -72.0;

        // Mall outer width boundaries
        if (pos.x < -17.2) pos.x = -17.2;
        if (pos.x > 17.2) pos.x = 17.2;

        // Central Hallway walls (X = -5.8 to X = 5.8)
        // West Hallway wall with 2 boutique doorways
        if (pos.x < -5.6 && pos.x > -6.4) {
          var inShop1Door = (pos.z <= -13.0 && pos.z >= -17.0);
          var inShop2Door = (pos.z <= -48.0 && pos.z >= -52.0);
          if (!inShop1Door && !inShop2Door) {
            pos.x = -5.6;
          }
        }

        // East Hallway wall with 2 boutique doorways
        if (pos.x > 5.6 && pos.x < 6.4) {
          var inShop3Door = (pos.z <= -13.0 && pos.z >= -17.0);
          var inShop4Door = (pos.z <= -48.0 && pos.z >= -52.0);
          if (!inShop3Door && !inShop4Door) {
            pos.x = 5.6;
          }
        }

        // West shops interior perimeter clamps
        if (pos.x < -6.4) {
          // Shop 1 (Z: -8.5 to -21.5)
          if (pos.z > -28.0 && pos.z < -4.0) {
            if (pos.z > -8.5) pos.z = -8.5;
            if (pos.z < -21.5) pos.z = -21.5;
          }
          // Shop 2 (Z: -43.5 to -56.5)
          if (pos.z > -62.0 && pos.z < -38.0) {
            if (pos.z > -43.5) pos.z = -43.5;
            if (pos.z < -56.5) pos.z = -56.5;
          }
        }

        // East shops interior perimeter clamps
        if (pos.x > 6.4) {
          // Shop 3 (Z: -8.5 to -21.5)
          if (pos.z > -28.0 && pos.z < -4.0) {
            if (pos.z > -8.5) pos.z = -8.5;
            if (pos.z < -21.5) pos.z = -21.5;
          }
          // Shop 4 (Z: -43.5 to -56.5)
          if (pos.z > -62.0 && pos.z < -38.0) {
            if (pos.z > -43.5) pos.z = -43.5;
            if (pos.z < -56.5) pos.z = -56.5;
          }
        }
      }
    });
  </script>
</head>
<body>

  <!-- 3D A-Frame Mall Scene -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable"
    background="color: #0b1329"
    style="width: 100%; height: 100%; position: absolute; top: 0; left: 0;"
  >
    <!-- Asset Library -->
    <a-assets timeout="10000">
      <img id="img-phone" src="/images/smartphone.jpg" crossorigin="anonymous">
      <img id="img-laptop" src="/images/laptop.jpg" crossorigin="anonymous">
      <img id="img-tshirt" src="/images/tshirt.jpg" crossorigin="anonymous">
      <img id="img-jeans" src="/images/jeans.jpg" crossorigin="anonymous">
      <img id="img-sneakers" src="/images/sneakers.jpg" crossorigin="anonymous">
      <img id="img-sofa" src="/images/sofa.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- Sky -->
    <a-sky color="#0f172a"></a-sky>

    <!-- Mall Architectural Lighting -->
    <a-light type="ambient" color="#f8fafc" intensity="0.65"></a-light>
    
    <!-- Concourse Overhead Lighting -->
    <a-light type="directional" position="0 25 0" target="#concourse-center" intensity="0.85"></a-light>
    <a-light type="point" position="0 5 -15" intensity="1.2" distance="18" color="#f8fafc"></a-light>
    <a-light type="point" position="0 5 -35" intensity="1.2" distance="18" color="#f8fafc"></a-light>
    <a-light type="point" position="0 5 -55" intensity="1.2" distance="18" color="#f8fafc"></a-light>
    
    <!-- Boutique Accent Lighting -->
    <a-light type="point" position="-12 4.2 -15" intensity="1.6" distance="14" color="#e0f2fe"></a-light>
    <a-light type="point" position="-12 4.2 -50" intensity="1.6" distance="14" color="#fff1f2"></a-light>
    <a-light type="point" position="12 4.2 -15" intensity="1.6" distance="14" color="#eef2ff"></a-light>
    <a-light type="point" position="12 4.2 -50" intensity="1.6" distance="14" color="#fefce8"></a-light>

    <!-- ============================================================== -->
    <!-- MALL CONCOURSE (CENTRAL BOULEVARD)                             -->
    <!-- Hallway Width: 12m (X: -6 to +6), Length: 88m (Z: +10 to -74) -->
    <!-- ============================================================== -->
    <a-plane 
      id="concourse-center"
      position="0 0.01 -32" 
      rotation="-90 0 0" 
      width="12" 
      height="88" 
      color="#0f172a" 
      material="roughness: 0.2; metalness: 0.15"
    ></a-plane>

    <!-- Center Marble Runner Path -->
    <a-plane position="0 0.02 -32" rotation="-90 0 0" width="3.2" height="88" color="#1e293b" material="roughness: 0.1"></a-plane>

    <!-- Concourse Grand Ceiling with Glass Skylight Ribbon -->
    <a-plane position="0 6.0 -32" rotation="90 0 0" width="12" height="88" color="#0f172a" material="roughness: 0.8"></a-plane>
    <a-plane position="0 5.95 -32" rotation="90 0 0" width="2.6" height="88" color="#38bdf8" material="emissive: #0284c7; emissiveIntensity: 0.4"></a-plane>

    <!-- Concourse Planters -->
    <a-entity position="0 0 2">
      <a-box position="0 0.4 0" width="2.2" height="0.8" depth="2.2" color="#334155" material="roughness: 0.4"></a-box>
      <a-cylinder position="0 1.2 0" radius="0.9" height="1.2" color="#15803d" material="roughness: 0.9"></a-cylinder>
      <a-sphere position="0 1.8 0" radius="0.8" color="#16a34a"></a-sphere>
    </a-entity>
    <a-entity position="0 0 -32">
      <a-box position="0 0.4 0" width="2.2" height="0.8" depth="2.2" color="#334155" material="roughness: 0.4"></a-box>
      <a-cylinder position="0 1.2 0" radius="0.9" height="1.2" color="#15803d" material="roughness: 0.9"></a-cylinder>
      <a-sphere position="0 1.8 0" radius="0.8" color="#16a34a"></a-sphere>
    </a-entity>
    <a-entity position="0 0 -65">
      <a-box position="0 0.4 0" width="2.2" height="0.8" depth="2.2" color="#334155" material="roughness: 0.4"></a-box>
      <a-cylinder position="0 1.2 0" radius="0.9" height="1.2" color="#15803d" material="roughness: 0.9"></a-cylinder>
      <a-sphere position="0 1.8 0" radius="0.8" color="#16a34a"></a-sphere>
    </a-entity>

    <!-- Concourse Teak Benches -->
    <a-entity position="0 0 -16">
      <a-box position="0 0.4 0" width="2.6" height="0.1" depth="0.9" color="#78350f"></a-box>
      <a-cylinder position="-1.1 0.2 0" radius="0.06" height="0.4" color="#0f172a"></a-cylinder>
      <a-cylinder position="1.1 0.2 0" radius="0.06" height="0.4" color="#0f172a"></a-cylinder>
    </a-entity>
    <a-entity position="0 0 -50">
      <a-box position="0 0.4 0" width="2.6" height="0.1" depth="0.9" color="#78350f"></a-box>
      <a-cylinder position="-1.1 0.2 0" radius="0.06" height="0.4" color="#0f172a"></a-cylinder>
      <a-cylinder position="1.1 0.2 0" radius="0.06" height="0.4" color="#0f172a"></a-cylinder>
    </a-entity>

    <!-- South Mall Grand Glass Entrance Arch (Z = +10) -->
    <a-box position="0 3 10" width="12" height="6" depth="0.4" color="#0f172a" material="opacity: 0.9"></a-box>
    <a-text value="VIRTUAL STORE MALL" position="0 4.2 9.7" align="center" width="9" color="#38bdf8" font="roboto"></a-text>

    <!-- North Terminal Lounge Wall (Z = -74) -->
    <a-box position="0 3 -74" width="12" height="6" depth="0.5" color="#1e293b"></a-box>
    <a-text value="MALL PROMENADE LOUNGE" position="0 3.8 -73.7" align="center" width="7" color="#94a3b8" font="roboto"></a-text>


    <!-- ============================================================== -->
    <!-- SHOP 1: TECH GADGETS (ELECTRONICS)                             -->
    <!-- Position: X: -6 to -18 (W 12m), Z: -8 to -22 (D 14m), H: 5m    -->
    <!-- Center: (-12, 0, -15) | Entrance: X = -6 (Z: -13.5 to -16.5)   -->
    <!-- ============================================================== -->
    <a-entity id="shop1-container">
      <a-entity id="shop1-center" position="-12 0 -15"></a-entity>

      <!-- Floor: Polished Dark Tech Slate -->
      <a-plane position="-12 0.02 -15" rotation="-90 0 0" width="12" height="14" color="#0f172a" material="roughness: 0.15; metalness: 0.2"></a-plane>
      <!-- Ceiling -->
      <a-plane position="-12 5.0 -15" rotation="90 0 0" width="12" height="14" color="#1e293b" material="roughness: 0.8"></a-plane>

      <!-- Perimeter Walls -->
      <!-- Back Wall (North, Z = -22) -->
      <a-box position="-12 2.5 -22" width="12" height="5" depth="0.4" color="#1e293b"></a-box>
      <!-- Far Wall (West, X = -18) -->
      <a-box position="-18 2.5 -15" width="0.4" height="5" depth="14" color="#1e293b"></a-box>
      <!-- Front Wall (South, Z = -8) -->
      <a-box position="-12 2.5 -8" width="12" height="5" depth="0.4" color="#1e293b"></a-box>

      <!-- Entrance Facade on Concourse side (X = -6) with 3m Wide Doorway -->
      <a-box position="-6 2.5 -19.25" width="0.4" height="5" depth="5.5" color="#0f172a"></a-box>
      <a-box position="-6 2.5 -10.75" width="0.4" height="5" depth="5.5" color="#0f172a"></a-box>
      <a-box position="-6 4.3 -15" width="0.5" height="1.4" depth="3.0" color="#0f172a"></a-box>

      <!-- Store Entrance Signboard -->
      <a-entity position="-5.7 4.3 -15" rotation="0 90 0">
        <a-box width="2.8" height="0.9" depth="0.15" color="#0369a1" material="emissive: #0284c7; emissiveIntensity: 0.4"></a-box>
        <a-text value="TECH GADGETS" align="center" position="0 0.12 0.1" width="4.8" color="#ffffff" font="roboto"></a-text>
        <a-text value="ELECTRONICS & COMPUTING" align="center" position="0 -0.2 0.1" width="3.2" color="#bae6fd" font="roboto"></a-text>
      </a-entity>

      <!-- Center Display Counter (Island Table) -->
      <a-box position="-12 0.45 -15" width="2.6" height="0.9" depth="1.2" color="#0284c7">
        <a-plane position="0 0.46 0" rotation="-90 0 0" width="2.7" height="1.3" color="#38bdf8"></a-plane>
      </a-box>

      <!-- WALL MOUNTED PRODUCT PLAQUES (SHOP 1) -->
      <!-- Perfectly measured: Plaque Width 2.0, Height 2.2, Eye-Level Y = 1.9 -->

      <!-- WEST WALL (X = -17.75, facing East / rotation 0 90 0) -->
      <!-- Product 1: Smartphone Pro (Z = -18.0) -->
      <a-entity position="-17.75 1.9 -18.0" rotation="0 90 0" class="clickable"
        product-plaque="id: 6accf74b6e9c4d717269541e; name: Smartphone Pro; price: 899; category: electronics; imageUrl: /images/smartphone.jpg; description: Latest high-end smartphone with OLED display and advanced camera.; storeId: tech-gadgets">
        <a-box class="clickable" width="2.0" height="2.2" depth="0.08" color="#0f172a"></a-box>
        <a-plane class="clickable" position="0 0 0.045" width="1.9" height="2.1" color="#1e293b"></a-plane>
        <a-image class="clickable" src="/images/smartphone.jpg" width="1.6" height="1.15" position="0 0.35 0.055"></a-image>
        <a-text class="clickable" value="Smartphone Pro" align="center" position="0 -0.38 0.055" width="3.2" color="#ffffff" font="roboto"></a-text>
        <a-text class="clickable" value="Rs. 899" align="center" position="0 -0.62 0.055" width="3.8" color="#38bdf8" font="roboto"></a-text>
        <a-plane class="clickable" position="0 -0.85 0.055" width="1.2" height="0.22" color="#0284c7">
          <a-text value="CLICK TO VIEW" align="center" position="0 0 0.01" width="2.2" color="#ffffff"></a-text>
        </a-plane>
      </a-entity>

      <!-- Product 2: Smart Watch Pro (Z = -15.0) -->
      <a-entity position="-17.75 1.9 -15.0" rotation="0 90 0" class="clickable"
        product-plaque="id: 6accf74b6e9c4d7172695441; name: Smart Watch Pro; price: 199; category: electronics; imageUrl: https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80; description: Advanced health monitoring smartwatch with AMOLED touch display.; storeId: tech-gadgets">
        <a-box class="clickable" width="2.0" height="2.2" depth="0.08" color="#0f172a"></a-box>
        <a-plane class="clickable" position="0 0 0.045" width="1.9" height="2.1" color="#1e293b"></a-plane>
        <a-image class="clickable" src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" width="1.6" height="1.15" position="0 0.35 0.055"></a-image>
        <a-text class="clickable" value="Smart Watch Pro" align="center" position="0 -0.38 0.055" width="3.2" color="#ffffff" font="roboto"></a-text>
        <a-text class="clickable" value="Rs. 199" align="center" position="0 -0.62 0.055" width="3.8" color="#38bdf8" font="roboto"></a-text>
        <a-plane class="clickable" position="0 -0.85 0.055" width="1.2" height="0.22" color="#0284c7">
          <a-text value="CLICK TO VIEW" align="center" position="0 0 0.01" width="2.2" color="#ffffff"></a-text>
        </a-plane>
      </a-entity>

      <!-- Product 3: Tablet Air 11 (Z = -12.0) -->

        product-plaque="id: 6accf74b6e9c4d7172695442; name: Tablet Air 11; price: 449; category: electronics; imageUrl: https://images.unsplash.com/photo-1561154464-82e9adf32764?w=500&q=80; description: High performance 11-inch tablet with stylus support.; storeId: tech-gadgets">
        <a-box class="clickable" width="2.0" height="2.2" depth="0.08" color="#0f172a"></a-box>
        <a-plane class="clickable" position="0 0 0.045" width="1.9" height="2.1" color="#1e293b"></a-plane>
        <a-image class="clickable" src="https://images.unsplash.com/photo-1561154464-82e9adf32764?w=500&q=80" width="1.6" height="1.15" position="0 0.35 0.055"></a-image>
        <a-text class="clickable" value="Tablet Air 11" align="center" position="0 -0.38 0.055" width="3.2" color="#ffffff" font="roboto"></a-text>
        <a-text class="clickable" value="Rs. 449" align="center" position="0 -0.62 0.055" width="3.8" color="#38bdf8" font="roboto"></a-text>
        <a-plane class="clickable" position="0 -0.85 0.055" width="1.2" height="0.22" color="#0284c7">
          <a-text value="CLICK TO VIEW" align="center" position="0 0 0.01" width="2.2" color="#ffffff"></a-text>
        </a-plane>
      </a-entity>

      <!-- NORTH WALL (Z = -21.75, facing South / rotation 0 0 0) -->
      <!-- Product 4: Laptop Ultra (X = -15.0) -->
      <a-entity position="-15.0 1.9 -21.75" rotation="0 0 0" class="clickable"
        product-plaque="id: 6accf74b6e9c4d7172695421; name: Laptop Ultra; price: 1299; category: electronics; imageUrl: /images/laptop.jpg; description: Thin and light powerful laptop for professionals.; storeId: tech-gadgets">
        <a-box class="clickable" width="2.0" height="2.2" depth="0.08" color="#0f172a"></a-box>
        <a-plane class="clickable" position="0 0 0.045" width="1.9" height="2.1" color="#1e293b"></a-plane>

      </div>
      <div id="modal-body">
        <div id="modal-category">CATEGORY</div>
        <div id="modal-title">Product Title</div>
        <div id="modal-desc">Product description goes here.</div>
        <div id="modal-price-row">

          <button id="modal-action-btn" onclick="onModalActionClick()">Add to Cart</button>
        </div>
      </div>
    </div>

  <script>
    var currentSelectedProduct = null;

    // Teleportation function placing the player right at doorway looking inside
    function teleportTo(x, y, z, yawDeg) {
      var rig = document.getElementById('player-rig');
      var cam = document.getElementById('player-camera');
      if (rig) {
        if (rig.object3D) {
          rig.object3D.position.set(x, y, z);
        } else {
          rig.setAttribute('position', x + ' ' + y + ' ' + z);
        }
      }
      if (cam && cam.components && cam.components['look-controls']) {
        var yawRad = (yawDeg * Math.PI) / 180;
        cam.components['look-controls'].yawObject.rotation.y = yawRad;
        cam.components['look-controls'].pitchObject.rotation.x = 0;
      }
      var buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(function (btn) { btn.classList.remove('active'); });
      if (window.event && window.event.target && window.event.target.classList) {
        window.event.target.classList.add('active');
      }
    }

    // Product Selection handler
    window.handleProductSelection = function (product) {
      currentSelectedProduct = product;
      console.log('[A-Frame Window] Selected 3D product:', product.name, product.id);

      // 1. Send postMessage to Parent React Application
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'SELECT_PRODUCT',
          product: product
        }, '*');
      }

      // 2. Also open standalone in-iframe modal if React panel is not overriding
      showStandaloneModal(product);
    };

    function showStandaloneModal(product) {
      var modal = document.getElementById('standalone-modal');
      var img = document.getElementById('modal-image');
      var title = document.getElementById('modal-title');
      var cat = document.getElementById('modal-category');
      var desc = document.getElementById('modal-desc');
      var price = document.getElementById('modal-price');

      if (!modal) return;

      img.src = product.imageUrl || '/images/smartphone.jpg';
      title.innerText = product.name;
      cat.innerText = (product.category || 'General').toUpperCase();
      desc.innerText = product.description || 'Quality item available in our 3D shopping store.';
      price.innerText = 'Rs. ' + Number(product.price).toLocaleString('en-IN');

      modal.style.display = 'block';
    }

    function closeStandaloneModal() {
      var modal = document.getElementById('standalone-modal');
      if (modal) modal.style.display = 'none';
      currentSelectedProduct = null;
    }

    function onModalActionClick() {
      if (!currentSelectedProduct) return;
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'ADD_TO_CART',
          product: currentSelectedProduct
        }, '*');
      } else {
        alert(currentSelectedProduct.name + ' added to cart! Please log in to your account at /login to finalize checkout.');
      }
      closeStandaloneModal();
    }

    window.addEventListener('message', function (event) {
      if (!event.data) return;
      if (event.data.type === 'CLOSE_STANDALONE_MODAL') {
        closeStandaloneModal();
      }
    });

    window.addEventListener('load', function () {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'AFRAME_SCENE_READY' }, '*');
      }
    });
  </script>
